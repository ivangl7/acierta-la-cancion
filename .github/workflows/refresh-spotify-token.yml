name: Refresh Spotify token

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/50 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Request a fresh client-credentials token
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
        run: |
          RESP=$(curl -sS -X POST "https://accounts.spotify.com/api/token" \
            --data-urlencode "grant_type=client_credentials" \
            --data-urlencode "client_id=${SPOTIFY_CLIENT_ID}" \
            --data-urlencode "client_secret=${SPOTIFY_CLIENT_SECRET}")
          echo "$RESP" | python3 -c "
          import json, sys, time
          d = json.load(sys.stdin)
          if 'access_token' not in d:
              print('Spotify no devolvió un token:', d, file=sys.stderr)
              sys.exit(1)
          out = {
              'access_token': d['access_token'],
              'expires_at': int(time.time()*1000) + d['expires_in']*1000
          }
          import os
          os.makedirs('data', exist_ok=True)
          with open('data/spotify-token.json', 'w') as f:
              json.dump(out, f)
          "

      - name: Commit and push the refreshed token
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/spotify-token.json
          git diff --cached --quiet && echo "Sin cambios" || git commit -m "Renovar token de Spotify [skip ci]"
          git push
